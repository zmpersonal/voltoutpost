name: Update resilience index and deploy
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: resilience-update
  cancel-in-progress: false
jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          NLR_API_KEY: ${{ secrets.NLR_API_KEY }}
        run: python scripts/update_index.py
      - name: Commit refreshed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data rankings cities states sitemap.xml || true
          git diff --cached --quiet || git commit -m "Refresh resilience index"
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
